name: Package compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve affected packages
    runs-on: ubuntu-latest
    outputs:
      candidate-version: ${{ steps.selection.outputs.candidate-version }}
      candidate-matrix: ${{ steps.selection.outputs.candidate-matrix }}
      minimum-matrix: ${{ steps.selection.outputs.minimum-matrix }}
      has-candidate: ${{ steps.selection.outputs.has-candidate }}
      has-minimum: ${{ steps.selection.outputs.has-minimum }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve compatibility matrix
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            selection_args=(--all)
          else
            selection_args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          fi

          candidate_matrix="$(
            python .github/scripts/package_compatibility.py matrix "${selection_args[@]}"
          )"
          minimum_matrix="$(
            python .github/scripts/package_compatibility.py minimum-matrix               "${selection_args[@]}"
          )"
          candidate_version="$(
            python .github/scripts/package_compatibility.py candidate-version
          )"

          echo "candidate-matrix=$candidate_matrix" >> "$GITHUB_OUTPUT"
          echo "minimum-matrix=$minimum_matrix" >> "$GITHUB_OUTPUT"
          echo "candidate-version=$candidate_version" >> "$GITHUB_OUTPUT"

          if [[ "$candidate_matrix" == '{"include":[]}' ]]; then
            echo "has-candidate=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-candidate=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$minimum_matrix" == '{"include":[]}' ]]; then
            echo "has-minimum=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-minimum=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Candidate version: $candidate_version"
          echo "Candidate matrix: $candidate_matrix"
          echo "Minimum matrix: $minimum_matrix"

  build:
    name: Build candidate artifacts
    if: needs.prepare.outputs.has-candidate == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CANDIDATE_VERSION: ${{ needs.prepare.outputs.candidate-version }}
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.candidate-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build all publishable distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-dist
          for package in sefia sefia_litellm sefia_typer sefia_fastapi sefios; do
            python -m build               --sdist               --outdir "$GITHUB_WORKSPACE/candidate-dist"               "packages/${package}"
            python -m build               --wheel               --outdir "$GITHUB_WORKSPACE/candidate-dist"               "packages/${package}"
          done

      - name: Verify candidate artifact metadata
        run: >
          python .github/scripts/package_compatibility.py verify-artifacts
          --artifact-dir candidate-dist
          --version "$CANDIDATE_VERSION"

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-compatibility-candidates
          path: candidate-dist/
          if-no-files-found: error
          retention-days: 7

  validate-candidate:
    name: Candidate / ${{ matrix.distribution }}
    if: needs.prepare.outputs.has-candidate == 'true'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.candidate-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-compatibility-candidates
          path: candidate-dist

      - name: Create isolated environment
        run: python -m venv .compat-venv

      - name: Install candidate package graph
        env:
          CANDIDATE_VERSION: ${{ needs.prepare.outputs.candidate-version }}
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$GITHUB_WORKSPACE/.compat-venv/bin/python"
          "$python_bin" -m pip install --upgrade pip

          "$python_bin" .github/scripts/package_compatibility.py             candidate-constraints             --artifact-dir candidate-dist             --version "$CANDIDATE_VERSION"             --output candidate-constraints.txt

          target_requirement="$(
            "$python_bin" .github/scripts/package_compatibility.py               wheel-requirement               --artifact-dir candidate-dist               --version "$CANDIDATE_VERSION"               --distribution "${{ matrix.distribution }}"
          )"

          "$python_bin" -m pip install             --constraint candidate-constraints.txt             "$target_requirement"             "pytest>=8.0"             "pytest-asyncio>=0.23"             "pytest-mock>=3.12.0"

      - name: Verify internal dependencies use candidate wheels
        env:
          CANDIDATE_VERSION: ${{ needs.prepare.outputs.candidate-version }}
        run: >
          .compat-venv/bin/python .github/scripts/package_compatibility.py
          verify-candidate-installed
          --artifact-dir candidate-dist
          --version "$CANDIDATE_VERSION"
          --distribution "${{ matrix.distribution }}"

      - name: Check installed dependency graph
        run: .compat-venv/bin/python -m pip check

      - name: Run package tests against candidate graph
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
        run: >
          .compat-venv/bin/python -m pytest
          "${{ matrix.tests }}"
          --import-mode=importlib
          --asyncio-mode=auto
          -m "not e2e"

  validate-minimum:
    name: Minimum bounds / ${{ matrix.distribution }}
    if: needs.prepare.outputs.has-minimum == 'true'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.minimum-matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: package-compatibility-candidates
          path: candidate-dist

      - name: Resolve declared minimum constraints
        run: >
          python .github/scripts/package_compatibility.py minimum-constraints
          --distribution "${{ matrix.distribution }}"
          --output minimum-constraints.txt

      - name: Check declared minimums are released
        id: minimum
        shell: bash
        run: |
          set +e
          python .github/scripts/package_compatibility.py             check-minimum-released             --distribution "${{ matrix.distribution }}"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 2 ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping until every declared lower bound has a release tag."
          else
            exit "$status"
          fi

      - name: Create isolated environment
        if: steps.minimum.outputs.run == 'true'
        run: python -m venv .compat-venv

      - name: Install current package with declared minimum dependencies
        if: steps.minimum.outputs.run == 'true'
        env:
          CANDIDATE_VERSION: ${{ needs.prepare.outputs.candidate-version }}
        shell: bash
        run: |
          set -euo pipefail
          python_bin="$GITHUB_WORKSPACE/.compat-venv/bin/python"
          "$python_bin" -m pip install --upgrade pip

          target_requirement="$(
            "$python_bin" .github/scripts/package_compatibility.py               wheel-requirement               --artifact-dir candidate-dist               --version "$CANDIDATE_VERSION"               --distribution "${{ matrix.distribution }}"
          )"

          "$python_bin" -m pip install             --constraint minimum-constraints.txt             "$target_requirement"             "pytest>=8.0"             "pytest-asyncio>=0.23"             "pytest-mock>=3.12.0"

      - name: Verify declared minimum versions were installed
        if: steps.minimum.outputs.run == 'true'
        env:
          CANDIDATE_VERSION: ${{ needs.prepare.outputs.candidate-version }}
        run: >
          .compat-venv/bin/python .github/scripts/package_compatibility.py
          verify-minimum-installed
          --distribution "${{ matrix.distribution }}"
          --constraints minimum-constraints.txt
          --artifact-dir candidate-dist
          --version "$CANDIDATE_VERSION"

      - name: Check installed dependency graph
        if: steps.minimum.outputs.run == 'true'
        run: .compat-venv/bin/python -m pip check

      - name: Run package tests against declared minimums
        if: steps.minimum.outputs.run == 'true'
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
        run: >
          .compat-venv/bin/python -m pytest
          "${{ matrix.tests }}"
          --import-mode=importlib
          --asyncio-mode=auto
          -m "not e2e"
