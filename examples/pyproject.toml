[project]
name = "sefia-examples"
version = "0.1.0"
description = "Usage examples for the sefia framework."
requires-python = ">=3.11"
dependencies = [
    # sefia and sefia_litellm are expected to be installed
    # in editable mode from the repository root.
    "typer[all]",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
