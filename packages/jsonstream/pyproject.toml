[project]
name = "jsonstream"
version = "0.1.0"
description = "Incremental JSON parser that emits streaming parse events."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonstream"]

[tool.pytest.ini_options]
testpaths = ["src/jsonstream/tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
