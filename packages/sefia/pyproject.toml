[project]
name = "sefia"
description = "Define LLM-powered steps as typed async Python functions."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "nueruyu" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.6",
    "glyff>=0.16.0",
    "glyff-file-store>=0.16.0",
    "glyff-pydantic>=0.16.0",
    "jsonschema>=4.18",
    "jsonweir>=0.1.0",
]
dynamic = ["version"]
keywords = [
    "llm",
    "inference",
    "agents",
    "durable-execution",
    "human-in-the-loop",
    "pydantic",
    "asyncio",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nueruyu/sefia"
Repository = "https://github.com/nueruyu/sefia"
Issues = "https://github.com/nueruyu/sefia/issues"
Documentation = "https://github.com/nueruyu/sefia/tree/main/docs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefia"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12.0"]
