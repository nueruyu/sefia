[project]
name = "sefia"
version = "0.1.0"
description = "Define LLM-powered steps as typed async Python functions."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "glyff>=0.13.0",
    "glyff-file-store>=0.13.0",
    "glyff-pydantic>=0.13.0",
    "jsonschema>=4.18",
    "jsonweir>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefia"]

# importlib mode allows duplicate test basenames (units/ vs scenarios/) in this
# non-package test tree; the root pyproject sets the same mode for full-repo runs.
[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12.0"]
