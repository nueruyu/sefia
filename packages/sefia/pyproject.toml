[project]
name = "sefia"
version = "0.1.0"
description = "Define LLM-powered steps as typed async Python functions."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typing-extensions>=4.6",
    "glyff>=0.13.0",
    "glyff-file-store>=0.13.0",
    "glyff-pydantic>=0.13.0",
    "jsonschema>=4.18",
    "jsonweir>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The tree has duplicate basenames (units/ vs scenarios/); importlib mode keeps
# package-scoped runs (`uv run pytest packages/sefia`) from failing on them.
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12.0"]
