[project]
name = "sefia"
version = "0.1.0"
description = "LLM-powered inference framework built on glyff checkpointing."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.0",
    "ddgs",
    "glyff>=0.3.0",
    "glyff-file-store>=0.3.0",
    "glyff-pydantic>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12.0"]
