[project]
name = "sefia_litellm"
version = "0.1.0"
description = "LiteLLM adapter for Sefia."
requires-python = ">=3.11"
dependencies = [
    "sefia",
    # 1.63.0 is the first release exposing reasoning_content / thinking blocks,
    # which the adapter reads and streams; older versions install fine but would
    # silently drop reasoning.
    "litellm>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefia_litellm"]

# Mirrors the root pyproject's pytest options so `uv run pytest
# packages/sefia_litellm` (which resolves this file as the config) behaves the
# same: e2e tests stay opt-in via `-m e2e`.
[tool.pytest.ini_options]
addopts = ["-m", "not e2e"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: live LLM provider tests (need API keys; run with `pytest -m e2e`)",
]

[tool.uv.sources]
sefia = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12.0"]
