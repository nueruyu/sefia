[project]
name = "sefia-typer"
description = "Typer (CLI) building blocks for Sefia applications."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "nueruyu" }]
requires-python = ">=3.11"
dependencies = [
    "sefia>=0.3.0",
    "typer>=0.12",
    "rich>=13.0",
]
dynamic = ["version"]
keywords = [
    "cli",
    "typer",
    "human-in-the-loop",
    "sefia",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nueruyu/sefia"
Repository = "https://github.com/nueruyu/sefia"
Issues = "https://github.com/nueruyu/sefia/issues"
Documentation = "https://github.com/nueruyu/sefia/tree/main/docs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefia_typer"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
sefia = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12.0"]
