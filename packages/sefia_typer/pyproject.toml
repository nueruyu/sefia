[project]
name = "sefia_typer"
version = "0.1.0"
description = "Typer (CLI) building blocks for Sefia applications."
requires-python = ">=3.11"
dependencies = [
    "sefia",
    "typer",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefia_typer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
sefia = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12.0"]
