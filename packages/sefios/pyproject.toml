[project]
name = "sefios"
version = "0.1.0"
description = "Official Stack for building applications with the Sefia framework."
requires-python = ">=3.11"
dependencies = [
    "sefia>=0.1.0",
]

[project.optional-dependencies]
litellm = ["sefia-litellm>=0.1.0"]
web = ["ddgs"]
cli = ["typer", "rich", "python-dotenv"]
all = [
    "sefios[litellm]",
    "sefios[web]",
    "sefios[cli]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefios"]
