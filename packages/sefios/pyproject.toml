[project]
name = "sefios"
description = "Opinionated Stack for building applications with the Sefia framework."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "nueruyu" }]
requires-python = ">=3.11"
dependencies = [
    "sefia>=0.3.0",
    "typing-extensions>=4.6",
    "glyff>=0.16.0",
    "glyff-sqlite>=0.16.0",
    "glyff-pydantic>=0.16.0",
]
dynamic = ["version"]
keywords = [
    "llm",
    "agents",
    "durable-execution",
    "human-in-the-loop",
    "sefia",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
file-store = ["glyff-file-store>=0.16.0"]
litellm = ["sefia-litellm>=0.1.0"]
web = ["ddgs>=9.0"]
cli = ["sefia-typer>=0.2.0"]
fastapi = ["sefia-fastapi>=0.3.0"]
all = [
    "sefios[litellm]",
    "sefios[web]",
    "sefios[cli]",
    "sefios[fastapi]",
    "sefios[file-store]",
]

[project.urls]
Homepage = "https://github.com/nueruyu/sefia"
Repository = "https://github.com/nueruyu/sefia"
Issues = "https://github.com/nueruyu/sefia/issues"
Documentation = "https://github.com/nueruyu/sefia/tree/main/docs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sefios"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }
