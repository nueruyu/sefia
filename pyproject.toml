[tool.uv.workspace]
members = [
    "packages/sefia",
    "packages/sefia_litellm",
    "packages/sefios",
    "examples"
]

[tool.uv.sources]
sefia = { workspace = true }
sefia-litellm = { workspace = true }
sefios = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest-cov>=6.0",
    "ruff>=0.15.16",
]

[tool.coverage.run]
branch = true
source = [
    "sefia",
    "sefia_litellm",
    "sefios",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.pyright]
include = ["packages", "examples"]
exclude = [".venv", ".uv-cache", "**/__pycache__"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
