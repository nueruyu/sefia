[tool.uv.workspace]
members = [
    "packages/sefia",
    "packages/sefia_litellm",
    "packages/sefios",
    "examples"
]

[tool.uv.sources]
sefia = { workspace = true }
sefia-litellm = { workspace = true }
sefios = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"

[tool.pyright]
include = ["packages", "examples"]
exclude = [".venv", ".uv-cache", "**/__pycache__"]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.16",
]
